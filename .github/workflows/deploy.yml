# Publica o CRM Nossa Ótica no GitHub Pages a cada push na main.
# A chave abaixo é a "publishable/anon" do Supabase — ela é pública
# por design (vai embutida no site de qualquer forma); a proteção
# dos dados é feita pelas políticas RLS no banco.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ebulzypbvbdprztnhitf.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_njusmnRJ_23CGE7GYB-jCA_xdiM9yGL
      # Site servido em https://<usuario>.github.io/<repo>/
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 24 porque os testes de regra (scripts/test-*.mjs) importam os
          # arquivos .ts direto — o Node só lê TypeScript a partir da 22.18.
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify anonymous Supabase access is denied
        run: npm run security:test-anon
      - name: Verify per-role route access
        run: npm run security:test-permissions
      - name: Verify O.S. keeps laboratory data
        run: npm run test:os-laboratorio
      - name: Verify team access errors are explicit
        run: npm run test:equipe-erros
      - name: Build with Next.js
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
