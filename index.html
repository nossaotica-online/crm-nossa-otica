<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080808" />
  <title>CRM Nossa Ótica</title>
  <style>
    :root{color-scheme:dark;--gold:#d8bd8a;--gold2:#a9874d;--ink:#080808;--card:#111;--muted:#aaa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#2c2519 0,#111 32%,var(--ink) 72%);font:16px Inter,system-ui,sans-serif;color:#fff}
    main{width:min(92vw,560px);padding:48px;text-align:center;border:1px solid #d8bd8a33;border-radius:28px;background:#0d0d0de8;box-shadow:0 30px 80px #000}
    img{width:min(290px,80%);height:auto}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.2em;font-size:.72rem;font-weight:800}h1{font-size:clamp(2rem,7vw,3.5rem);margin:.5rem 0}p{color:var(--muted);line-height:1.6;margin:0 auto 2rem;max-width:420px}a{display:inline-block;padding:14px 26px;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0a0a0a;text-decoration:none;font-weight:800}
  </style>
</head>
<body><main><img src="./public/logo.png" alt="Nossa Ótica" /><div class="eyebrow">Gestão de clientes e vendas</div><h1>CRM Nossa Ótica</h1><p>Atendimentos, exames, orçamentos e vendas em um só lugar.</p><a href="http://localhost:3000/">Acessar o CRM</a></main></body>
</html>
